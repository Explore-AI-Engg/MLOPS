name: Build and deploy to GKE

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read       # 🌟 FIX: Grants GITHUB_TOKEN permission to look up cross-workflow run IDs

jobs:
  deploy:
    name: Build image and deploy to GKE
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 🌟 Get the run ID of the latest successful CI workflow run
      - name: Get latest CI workflow run ID
        id: get-run-id
        run: |
          RUN_ID=$(gh run list --workflow heart-disease-mlops-ci --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Error: No successful CI runs found for the master branch."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🌟 Download the artifact using the retrieved run-id and a GitHub token
      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: heart-disease-mlops-artifacts
          path: artifacts/
          run-id: ${{ steps.get-run-id.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE="ghcr.io/explore-ai-engg/heart-disease-api"
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"

      - name: Push Docker image
        run: |
          IMAGE="ghcr.io/explore-ai-engg/heart-disease-api"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: github-actions-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Connect to GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: heart-disease-cluster
          location: us-central1-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Apply Kubernetes manifest
        run: |
          kubectl apply -f deployment/k8s.yaml

      - name: Update image to this commit
        run: |
          # 🌟 UPDATED: Directs Kubernetes to run the specific image tag we just built
          kubectl set image deployment/heart-disease-api \
            api=ghcr.io/explore-ai-engg/heart-disease-api:${{ github.sha }}

      - name: Wait for rollout
        id: rollout
        continue-on-error: true # 🌟 FIX: Keeps the pipeline moving so the debug log step can print errors
        run: |
          kubectl rollout status deployment/heart-disease-api --timeout=240s

      # 🌟 NEW DEBUG STEP: If the rollout fails, this prints container error logs directly inside GitHub Actions
      - name: Print Container Logs and Status on Failure
        run: |
          echo "=== POD STATUS ==="
          kubectl get pods -l app=heart-disease-api
          
          echo "=== RECENT KUBERNETES EVENTS ==="
          kubectl describe pod -l app=heart-disease-api | tail -n 25
          
          echo "=== APPLICATION ERROR LOGS ==="
          kubectl logs deployment/heart-disease-api --all-containers=true --tail=100
          
          # Force pipeline failure if the rollout status check step timed out
          kubectl rollout status deployment/heart-disease-api --timeout=1s

      # 🌟 Displays final infrastructure topology status if the rollout succeeded
      - name: Display deployment status
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
