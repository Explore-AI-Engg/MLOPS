name: Deploy heart disease API to GKE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    name: Train, build, push, and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run linting
        run: |
          python -m ruff check app scripts tests

      - name: Download dataset
        run: |
          python -m scripts.download_data

      - name: Prepare processed data
        run: |
          python -m scripts.prepare_data

      - name: Train model artifacts
        run: |
          python -m scripts.train --tracking-uri file:./mlruns

      - name: Verify model artifacts
        run: |
          test -f artifacts/model.joblib
          test -f artifacts/model_metadata.json
          ls -lh artifacts/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE="ghcr.io/explore-ai-engg/heart-disease-api"
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"

      - name: Push Docker image
        run: |
          IMAGE="ghcr.io/explore-ai-engg/heart-disease-api"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: github-actions-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Connect to GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: heart-disease-cluster
          location: us-central1-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Apply Kubernetes manifest
        run: |
          kubectl apply -f deployment/k8s.yaml

      - name: Update deployment image
        run: |
          kubectl set image deployment/heart-disease-api \
            api=ghcr.io/explore-ai-engg/heart-disease-api:${{ github.sha }}

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/heart-disease-api --timeout=180s

        # 🌟 NEW DEBUG STEP: If the rollout fails, this prints container error logs directly inside GitHub Actions
      - name: Print Container Logs and Status on Failure
        run: |
          echo "=== POD STATUS ==="
          kubectl get pods -l app=heart-disease-api
          
          echo "=== RECENT KUBERNETES EVENTS ==="
          kubectl describe pod -l app=heart-disease-api | tail -n 25
          
          echo "=== APPLICATION ERROR LOGS ==="
          kubectl logs deployment/heart-disease-api --all-containers=true --tail=100
          
          # Force pipeline failure if the rollout status check step timed out
          kubectl rollout status deployment/heart-disease-api --timeout=1s

      - name: Display Kubernetes status
        run: |
          echo "=== DEPLOYMENTS ==="
          kubectl get deployments

          echo "=== PODS ==="
          kubectl get pods

          echo "=== SERVICES ==="
          kubectl get services