name: Build and deploy to GKE

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    name: Build image and deploy to GKE
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 1. 🌟 ADD THIS STEP TO FETCH THE MISSING ARTIFACTS FOLDER
      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: heart-disease-mlops-artifacts
          path: artifacts/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Docker build will now succeed since artifacts/ is present
      - name: Build Docker image
        run: |
          IMAGE="ghcr.io/explore-ai-engg/heart-disease-api"
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"

      - name: Push Docker image
        run: |
          IMAGE="ghcr.io/explore-ai-engg/heart-disease-api"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: github-actions-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Connect to GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: heart-disease-cluster
          location: us-central1-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Apply Kubernetes manifest
        run: |
          kubectl apply -f deployment/k8s.yaml

      - name: Update image to this commit
        run: |
          kubectl set image deployment/heart-disease-api \
            api=ghcr.io/explore-ai-engg/heart-disease-api:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/heart-disease-api --timeout=180s

      - name: Display deployment status
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
