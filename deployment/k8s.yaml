apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-api
  labels:
    app: heart-disease-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heart-disease-api
  template:
    metadata:
      labels:
        app: heart-disease-api
    spec:
      containers:
        - name: api
          image: ghcr.io/explore-ai-engg/heart-disease-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m       # 🚀 UPDATED: Increased from 100m for faster startup
              memory: 256Mi   # 🚀 UPDATED: Increased from 256Mi to accommodate model loading
            limits:
              cpu: "500m"        # 🚀 UPDATED: Increased from 500m to handle prediction bursts
              memory: 512Mi     # 🚀 UPDATED: Increased from 512Mi to prevent OOM (Out Of Memory) kills
---
apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
  labels:
    app: heart-disease-api
spec:
  type: LoadBalancer
  selector:
    app: heart-disease-api
  ports:
    - name: http
      port: 8000
      targetPort: http
