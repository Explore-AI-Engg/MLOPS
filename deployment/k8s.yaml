apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-api
  labels:
    app: heart-disease-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heart-disease-api
  template:
    metadata:
      labels:
        app: heart-disease-api
    spec:
      containers:
        - name: api
          image: ghcr.io/explore-ai-engg/heart-disease-api:latest
          # 🌟 CRITICAL FIX: Forces Kubernetes to pull the newly built image every time
          imagePullPolicy: Always 
          ports:
            - name: http
              containerPort: 8000

          # 🌟 FIX: Relax probe configurations to allow ML models to load into memory
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30 # Increased from 10 to give your Python app startup time
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45 # Increased from 20 so liveness doesn't kill it prematurely
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
  labels:
    app: heart-disease-api
spec:
  type: LoadBalancer
  selector:
    app: heart-disease-api
  ports:
    - name: http
      port: 8000
      targetPort: http
